name: H5Reclaim checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  real-data-and-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local project
        run: python -m pip install -e .
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -q
      - name: Verify original scientific corpus
        run: python benchmarks/run_real_corpus.py
      - name: Recover controlled GWOSC copy
        run: python benchmarks/run_gwosc_recovery.py
