name: H5Reclaim checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Check syntax and undefined names
        run: |
          python -m pip install 'ruff>=0.14'
          python -m ruff check src tests tools benchmarks
  readme-translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Check translated README links and technical examples
        run: python tools/check_readme_translations.py
  installed-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Build source distribution and wheel from it
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel without an editable checkout
        run: python -m pip install dist/*.whl
      - name: Recover data through the installed console command
        run: python tools/check_installed_package.py
  release-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install recovery dependencies
        run: python -m pip install -e ".[filters]"
      - name: Check independent evaluation and incident scoring
        run: python -m unittest benchmarks.test_authentic_v09_routes benchmarks.test_heldout_trials benchmarks.test_incident_intake benchmarks.test_release_coverage -q
      - name: Independently score automatic rescue across layouts and faults
        run: python benchmarks/run_release_coverage.py --work-dir work/release-coverage
      - name: Independently score count, filter and cache-image repairs
        run: python benchmarks/run_metadata_repair.py --work-dir work/metadata-repair --output work/metadata-repair.json
  real-data-and-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local project
        run: python -m pip install -e ".[filters]"
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -q
      - name: Verify original scientific corpus
        if: matrix.python-version == '3.12'
        run: python benchmarks/run_real_corpus.py
      - name: Recover controlled GWOSC copy
        if: matrix.python-version == '3.12'
        run: python benchmarks/run_gwosc_recovery.py
      - name: Independently compare whole-file scientific exports
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: python benchmarks/run_whole_file_corpus.py
  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.10'
      - name: Install declared minimum dependencies
        run: |
          python -m pip install numpy==1.26.0 h5py==3.10.0 hdf5plugin
          python -m pip install -e . --no-deps
      - name: Check recovery compatibility
        run: python -m unittest discover -s tests -q
  application-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install application writers and readers
        run: python -m pip install -e ".[filters,applications]"
      - name: Check intact and damaged application files
        run: python benchmarks/run_application_corpus.py
  recovery-workbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Cache official HDF5 tool binaries
        id: hdf5-tools-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/h5reclaim-hdf5-tools
          key: hdf5-tools-ubuntu24-${{ runner.arch }}-49df1b4e5ca4108d56e80f06321a749da1535268-cmake33110-static-zlib-v1
      - name: Fetch pinned official HDF5 source
        if: steps.hdf5-tools-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: HDFGroup/hdf5
          ref: 49df1b4e5ca4108d56e80f06321a749da1535268 # HDF5 2.2.0
          path: work/hdf5-source
          persist-credentials: false
      - name: Build official HDF5 copy and repack tools
        if: steps.hdf5-tools-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'cmake==3.31.10'
          hdf5_build="$RUNNER_TEMP/h5reclaim-hdf5-build"
          hdf5_prefix="$RUNNER_TEMP/h5reclaim-hdf5-tools"
          cmake -S work/hdf5-source -B "$hdf5_build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF \
            -DHDF5_BUILD_TOOLS=ON -DHDF5_BUILD_STATIC_TOOLS=ON \
            -DHDF5_BUILD_EXAMPLES=OFF -DHDF5_BUILD_HL_LIB=OFF \
            -DHDF5_BUILD_CPP_LIB=OFF -DHDF5_BUILD_FORTRAN=OFF \
            -DHDF5_ENABLE_ZLIB_SUPPORT=ON -DHDF5_ENABLE_SZIP_SUPPORT=OFF
          cmake --build "$hdf5_build" --target h5copy h5repack --parallel 2
          install -Dm755 "$hdf5_build/bin/h5copy" "$hdf5_prefix/bin/h5copy"
          install -Dm755 "$hdf5_build/bin/h5repack" "$hdf5_prefix/bin/h5repack"
      - name: Verify and enable official HDF5 tools
        shell: bash
        run: |
          set -euo pipefail
          hdf5_prefix="$RUNNER_TEMP/h5reclaim-hdf5-tools"
          "$hdf5_prefix/bin/h5copy" -V
          "$hdf5_prefix/bin/h5repack" -V
          echo "$hdf5_prefix/bin" >> "$GITHUB_PATH"
      - name: Install optional reader and recovery dependencies
        run: python -m pip install -e ".[filters,readers]"
      - name: Check workbench, alternate reader and actual copy/repack integrations
        run: python -m unittest discover -s tests -p 'test_external_tools.py' -q
      - name: Check independent reader agreement
        run: python -m unittest discover -s tests -p 'test_alternative_reader.py' -q
      - name: Independently score compressed multidimensional index repairs
        run: python benchmarks/run_streaming_recovery.py --output workbench-coverage.json
  release-artifacts:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [static-checks, readme-translations, installed-package, release-coverage, real-data-and-tests, minimum-dependencies, application-compatibility, recovery-workbench]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Build installable archives
        run: |
          python -m pip install build twine
          python -m build
      - name: Check archive contents and generate hashes
        run: python tools/check_release_artifacts.py dist --tag "$GITHUB_REF_NAME"
      - name: Check package descriptions
        run: python -m twine check --strict dist/*.tar.gz dist/*.whl
      - name: Make passing release archives available
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: h5reclaim-release-assets
          path: |
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Attach validated packages to a reviewable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --clobber
