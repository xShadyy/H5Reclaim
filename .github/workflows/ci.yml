name: H5Reclaim checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  readme-translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check translated README links and technical examples
        run: python tools/check_readme_translations.py
  installed-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build source distribution and wheel from it
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel without an editable checkout
        run: python -m pip install dist/*.whl
      - name: Recover data through the installed console command
        run: python tools/check_installed_package.py
  release-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install recovery dependencies
        run: python -m pip install -e ".[filters]"
      - name: Check independent evaluation and incident scoring
        run: python -m unittest benchmarks.test_authentic_v09_routes benchmarks.test_heldout_trials benchmarks.test_incident_intake benchmarks.test_release_coverage -q
      - name: Independently score automatic rescue across layouts and faults
        run: python benchmarks/run_release_coverage.py --work-dir work/release-coverage
  real-data-and-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local project
        run: python -m pip install -e ".[filters]"
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -q
      - name: Verify original scientific corpus
        if: matrix.python-version == '3.12'
        run: python benchmarks/run_real_corpus.py
      - name: Recover controlled GWOSC copy
        if: matrix.python-version == '3.12'
        run: python benchmarks/run_gwosc_recovery.py
      - name: Independently compare whole-file scientific exports
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: python benchmarks/run_whole_file_corpus.py
  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install declared minimum dependencies
        run: |
          python -m pip install numpy==1.26.0 h5py==3.10.0 hdf5plugin
          python -m pip install -e . --no-deps
      - name: Check recovery compatibility
        run: python -m unittest discover -s tests -q
  application-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install application writers and readers
        run: python -m pip install -e ".[filters,applications]"
      - name: Check intact and damaged application files
        run: python benchmarks/run_application_corpus.py
  release-candidate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [installed-package, release-coverage, real-data-and-tests, minimum-dependencies, application-compatibility]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build installable archives
        run: |
          python -m pip install build twine
          python -m build
      - name: Check archive contents and generate hashes
        run: python tools/check_release_artifacts.py dist --tag "$GITHUB_REF_NAME"
      - name: Check package descriptions
        run: python -m twine check --strict dist/*.tar.gz dist/*.whl
      - name: Make passing candidate archives available
        uses: actions/upload-artifact@v7
        with:
          name: h5reclaim-release-candidate
          path: |
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
