[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "h5reclaim"
version = "0.16.0"
description = "HDF5 data recovery, whole-file rescue, and verified streaming exports"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Tymoteusz Netter" }]
keywords = ["hdf5", "data-recovery", "scientific-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Recovery Tools",
]
dependencies = ["h5py>=3.10", "numpy>=1.26"]

[project.urls]
Repository = "https://github.com/xShadyy/H5Reclaim"
Documentation = "https://github.com/xShadyy/H5Reclaim/blob/main/docs/usage.md"
Issues = "https://github.com/xShadyy/H5Reclaim/issues"

[project.optional-dependencies]
filters = ["hdf5plugin>=5"]
applications = ["hdf5storage>=0.2", "netCDF4>=1.7", "pynwb>=3"]

[project.scripts]
h5reclaim = "h5reclaim.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["h5reclaim*"]
namespaces = false
