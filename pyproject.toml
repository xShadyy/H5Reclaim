[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "h5reclaim"
version = "0.14.0"
description = "HDF5 data recovery, whole-file rescue, and verified streaming exports"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["h5py>=3.10", "numpy>=1.26"]

[project.optional-dependencies]
filters = ["hdf5plugin>=5"]
applications = ["hdf5storage>=0.2", "netCDF4>=1.7", "pynwb>=3"]

[project.scripts]
h5reclaim = "h5reclaim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
